appId: com.ajinkya123.POSReactNativeApp
name: "QA 01: Setup Categories (Drinks / Mains / Starters)"
tags:
  - qa
  - menu-setup
---

# ─────────────────────────────────────────────────────
#  QA Phase 1 — Add 3 categories
#  Test Data: Drinks, Mains, Starters
#  Prerequisites: App data cleared (fresh start)
#
#  Notes:
#    - Uses testID="btn-add-category" — same ID in both collapsed
#      and expanded sidebar modes.
#    - After each save, re-expand sidebar (it may auto-collapse).
#    - Triple waitForAnimationToEnd after each save: keyboard dismiss
#      + KeyboardAvoidingView reflow + sidebar layout settle.
#    - Mock service starts empty (no-mock-data policy), so only
#      test-created categories appear in the sidebar.
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

# Navigate to Settings → Menu Management
- waitForAnimationToEnd

- tapOn:
    id: "tab-nav-settings"

- extendedWaitUntil:
    visible:
      id: "settings-nav-menu_management"
    timeout: 10000

- takeScreenshot: "qa_01_step0_settings_open"

# tapOn auto-scrolls the sidebar to find the item
- tapOn:
    id: "settings-nav-menu_management"

- extendedWaitUntil:
    visible: "Items"
    timeout: 10000

# Expand category sidebar (auto-collapsed in portrait on small tablets)
- tapOn:
    id: "btn-expand-sidebar"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "qa_01_step1_menu_mgmt_open"

# ═══════════════ ADD CATEGORY: Drinks ═══════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

# Wait for Save button — reliable indicator modal is open
- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- tapOn:
    id: "input-category-name"

- eraseText: 30

- inputText: "Drinks"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Re-expand sidebar if it collapsed
- tapOn:
    id: "btn-expand-sidebar"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "sidebar-category-Drinks"
    timeout: 8000

- assertVisible:
    id: "sidebar-category-Drinks"

- takeScreenshot: "qa_01_step2b_drinks_created"

# ═══════════════ ADD CATEGORY: Mains ════════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- tapOn:
    id: "input-category-name"

- eraseText: 30

- inputText: "Mains"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Re-expand sidebar if it collapsed
- tapOn:
    id: "btn-expand-sidebar"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "sidebar-category-Mains"
    timeout: 8000

- assertVisible:
    id: "sidebar-category-Mains"

- takeScreenshot: "qa_01_step3_mains_created"

# ═══════════════ ADD CATEGORY: Starters ═════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- tapOn:
    id: "input-category-name"

- eraseText: 30

- inputText: "Starters"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Re-expand sidebar if it collapsed
- tapOn:
    id: "btn-expand-sidebar"
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "sidebar-category-Starters"
    timeout: 8000

- assertVisible:
    id: "sidebar-category-Starters"

- takeScreenshot: "qa_01_step4_starters_created"

# FINAL QA: All 3 categories present (only 3 exist — no mock data)
- assertVisible:
    id: "sidebar-category-Drinks"
- assertVisible:
    id: "sidebar-category-Mains"
- assertVisible:
    id: "sidebar-category-Starters"

- takeScreenshot: "qa_01_PASS_all_categories"
