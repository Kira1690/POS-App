appId: com.ajinkya123.POSReactNativeApp
name: "QA 01: Setup Categories (Drinks / Mains / Starters)"
tags:
  - qa
  - menu-setup
---

# ─────────────────────────────────────────────────────
#  QA Phase 1 — Add 3 categories
#  Test Data: Drinks, Mains, Starters
#  Prerequisites: App cleared, dev build running
#
#  Notes:
#    - Uses testID="btn-add-category" — same ID in both collapsed
#      and expanded sidebar modes (no need to expand first).
#    - Uses testID="input-category-name" for the name TextInput.
#    - Uses testID="btn-save-category" for the Save button.
#    - Triple waitForAnimationToEnd after each save: keyboard dismiss
#      + KeyboardAvoidingView reflow + sidebar layout settle.
#      Without this the sidebar flickers and btn-add-category is
#      temporarily unavailable, causing only 2/3 categories.
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

# Navigate to Settings → Menu Management
- waitForAnimationToEnd

- tapOn:
    id: "tab-nav-settings"

- extendedWaitUntil:
    visible:
      id: "settings-nav-restaurant_profile"
    timeout: 10000

- takeScreenshot: "qa_01_step0_settings_open"

# tapOn auto-scrolls the sidebar to find the item
- tapOn:
    id: "settings-nav-menu_management"

- extendedWaitUntil:
    visible: "Items"
    timeout: 10000

- takeScreenshot: "qa_01_step1_menu_mgmt_open"

# ═══════════════ ADD CATEGORY: Drinks ═══════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

# Wait for Save button — reliable indicator modal is open
- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- takeScreenshot: "qa_01_step2a_add_category_modal_open"

- tapOn:
    id: "input-category-name"

- inputText: "Drinks"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Drinks"
    timeout: 8000

- assertVisible: "Drinks"

- takeScreenshot: "qa_01_step2b_drinks_created"

# ═══════════════ ADD CATEGORY: Mains ════════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- tapOn:
    id: "input-category-name"

- inputText: "Mains"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Mains"
    timeout: 8000

- assertVisible: "Mains"

- takeScreenshot: "qa_01_step3_mains_created"

# ═══════════════ ADD CATEGORY: Starters ═════════════
- tapOn:
    id: "btn-add-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Save Category"
    timeout: 10000

- tapOn:
    id: "input-category-name"

- inputText: "Starters"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    id: "btn-save-category"

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Save Category"
    timeout: 8000

# Triple wait: keyboard dismiss + KAV reflow + sidebar layout settle
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Starters"
    timeout: 8000

- assertVisible: "Starters"

- takeScreenshot: "qa_01_step4_starters_created"

# FINAL QA: All 3 categories present
- assertVisible: "Drinks"
- assertVisible: "Mains"
- assertVisible: "Starters"

- takeScreenshot: "qa_01_PASS_all_categories"
