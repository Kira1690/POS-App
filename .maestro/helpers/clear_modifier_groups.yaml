# Helper: Delete all modifier groups (handles up to 10 existing groups).
# Uses tapOn with optional:true — safe if 0 groups exist.
# Assumes the Modifiers tab is already visible.
# Each attempt: tap delete (optional), confirm (optional), wait.

# Attempt 1
- tapOn:
    id: "btn-delete-modifier-group"
    index: 0
    optional: true
- tapOn:
    id: "btn-confirm-delete"
    optional: true
- waitForAnimationToEnd

