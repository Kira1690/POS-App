appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Manager Login (Online — Blue Plate Bistro)"
---

# Logs in as manager with real API credentials.
# Credentials: manager@blueplatebistro.io / BluePlateMgr2026!
# Manager sees: Dashboard + Orders + Kitchen + Settings (4 tabs)

- launchApp:
    clearState: true

# Wait for database initialization + welcome screen to fully load
- extendedWaitUntil:
    visible:
      id: "btn-welcome-manager-login"
    timeout: 30000
- waitForAnimationToEnd

# Navigate to Manager Login (email-based login screen)
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Fill credentials
- tapOn:
    id: "email-input"
- inputText: "manager@blueplatebistro.io"
- tapOn:
    id: "password-input"
- inputText: "BluePlateMgr2026!"
- hideKeyboard
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Wait for app to fully load — manager sees all tabs
- extendedWaitUntil:
    visible:
      id: "tab-nav-orders"
    timeout: 30000
- waitForAnimationToEnd
- waitForAnimationToEnd
