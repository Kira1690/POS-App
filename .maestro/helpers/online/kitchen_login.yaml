appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Kitchen Staff Login (Online — Blue Plate Bistro)"
---

# Logs in as kitchen_staff with real API credentials.
# Credentials: kitchen@blueplatebistro.io / BluePlateKit2026!
# Kitchen staff sees: Dashboard + Kitchen tabs (2 tabs)

- launchApp:
    clearState: true

# Wait for database initialization + welcome screen to fully load
- extendedWaitUntil:
    visible:
      id: "btn-welcome-manager-login"
    timeout: 30000
- waitForAnimationToEnd

# Navigate to Manager Login (email-based login screen)
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Fill credentials
- tapOn:
    id: "email-input"
- eraseText: 50
- inputText: "kitchen@blueplatebistro.io"
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "password-input"
- eraseText: 50
- inputText: "BluePlateKit2026!"
- hideKeyboard
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Wait for app to fully load — kitchen staff lands on Kitchen tab
- extendedWaitUntil:
    visible:
      id: "tab-nav-kitchen"
    timeout: 30000
- waitForAnimationToEnd
- waitForAnimationToEnd
