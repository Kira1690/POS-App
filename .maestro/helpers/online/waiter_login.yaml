appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Waiter Login (Online — Blue Plate Bistro)"
---

# Logs in as waiter with real API credentials.
# Credentials: waiter@blueplatebistro.io / BluePlateWtr2026!
# Waiter sees: Dashboard + Orders tabs (2 tabs)

- launchApp:
    clearState: true

# Wait for database initialization + welcome screen to fully load
- extendedWaitUntil:
    visible:
      id: "btn-welcome-manager-login"
    timeout: 30000
- waitForAnimationToEnd

# Navigate to Manager Login (email-based login screen)
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Fill credentials
- tapOn:
    id: "email-input"
- eraseText: 50
- inputText: "waiter@blueplatebistro.io"
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "password-input"
- eraseText: 50
- inputText: "BluePlateWtr2026!"
- hideKeyboard
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Wait for app to fully load — waiter lands on Dashboard or Orders
- extendedWaitUntil:
    visible:
      id: "tab-nav-orders"
    timeout: 30000
- waitForAnimationToEnd
- waitForAnimationToEnd
