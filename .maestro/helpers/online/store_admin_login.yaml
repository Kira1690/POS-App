appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Store Admin Login (Online — Blue Plate Bistro)"
---

# Logs in as store_admin with real API credentials.
# Credentials: admin@blueplatebistro.io / BluePlate2026!
# Store admin sees: Dashboard + Orders + Kitchen + Settings (4 tabs)

- launchApp:
    clearState: true

# Wait for database initialization + welcome screen to fully load
- extendedWaitUntil:
    visible:
      id: "btn-welcome-manager-login"
    timeout: 30000
- waitForAnimationToEnd

# Navigate to Manager Login (email-based login screen)
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Fill credentials
- tapOn:
    id: "email-input"
- eraseText: 50
- inputText: "admin@blueplatebistro.io"
- hideKeyboard
- waitForAnimationToEnd

- tapOn:
    id: "password-input"
- eraseText: 50
- inputText: "BluePlate2026!"
- hideKeyboard
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Wait for app to fully load — store admin sees all tabs
- extendedWaitUntil:
    visible:
      id: "tab-nav-orders"
    timeout: 30000
- waitForAnimationToEnd
- waitForAnimationToEnd
