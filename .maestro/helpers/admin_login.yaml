appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Admin Login — admin@foodcorner.com"
---

# Opens the dev build app, clears state, and logs in as Admin.
# Credentials: admin@foodcorner.com / admin123 (David Admin)
# Admin sees all 4 tabs, lands on Orders tab.

- launchApp:
    clearState: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Wait for manager login form
- extendedWaitUntil:
    visible: "Email Address"
    timeout: 15000

# Login as admin
- tapOn:
    id: "email-input"
- inputText: "admin@foodcorner.com"
- tapOn:
    id: "password-input"
- inputText: "admin123"
- hideKeyboard
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Wait for app to fully load — admin sees all tabs
- extendedWaitUntil:
    visible:
      id: "tab-nav-orders"
    timeout: 30000
- waitForAnimationToEnd
