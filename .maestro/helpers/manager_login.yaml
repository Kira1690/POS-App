appId: com.ajinkya123.POSReactNativeApp
name: "Helper: Manager Login (QA Online Account)"
---

# Opens the app and logs in as QA Manager (online account with real API data)
# Credentials: qa-manager@blueplate2026.io / QAManager2026!

- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Login as manager using testIDs
- tapOn:
    id: "email-input"
- inputText: "qa-manager@blueplate2026.io"
- tapOn:
    id: "password-input"
- inputText: "QAManager2026!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd
