appId: com.ajinkya123.POSReactNativeApp
name: "QA 07: Kitchen Operations — Full Flow (Confirmed → Served)"
tags:
  - qa
  - kitchen
---

# ─────────────────────────────────────────────────────
#  QA Phase 7 — Full Kitchen lifecycle (self-contained)
#
#  Strategy:
#    1. Clear ALL stale kitchen tickets (advances them to SERVED)
#       so the kitchen is empty before we start
#    2. Cancel any B-1 active order in Order Management
#    3. Create a fresh B-1 order → Send to Kitchen → CONFIRMED
#    4. In Kitchen: B-1 is the ONLY ticket — no ambiguity
#    5. Advance: "Start" → PREPARING → "Ready" → READY → "Served" → SERVED
#    6. Verify SERVED in Order Management
#
#  Real button labels in running app (bundle mismatch from old cache):
#    PENDING  → "▶ Start"   (partial match: "Start")
#    PREPARING → "✓ Ready"  (partial match: "Ready")
#    READY    → "✓ Served"  (partial match: "Served")
#
#  QA Assertions:
#    ✓ All stale kitchen tickets cleared
#    ✓ Fresh B-1 ticket is the only ticket visible
#    ✓ After "Start" → PREPARING label on ticket
#    ✓ After "Ready" → READY label on ticket
#    ✓ After "Served" → ticket removed from Active view
#    ✓ Order Management shows SERVED status
#
#  Prerequisites: none — self-contained
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

# ── STEP 1: Clear ALL stale kitchen tickets ───────────────────────────────────
- tapOn:
    text: "Kitchen Operations"
# Wait for the actual Kitchen Display screen content, not just the tab label.
# "Kitchen Display" is the header title rendered by KitchenDisplayScreen.
- extendedWaitUntil:
    visible: "Kitchen Display"
    timeout: 15000

- takeScreenshot: "qa_07_step0_kitchen_before_cleanup"

- runFlow: helpers/clear_all_kitchen_tickets.yaml

- takeScreenshot: "qa_07_step1_kitchen_cleared"

# ── STEP 2: Cancel ALL existing B-1 active orders (run twice for multiple) ───
- tapOn:
    text: "Order Management"
- extendedWaitUntil:
    visible: "Order Management"
    timeout: 10000
- runFlow: helpers/cancel_b1_active_order.yaml
- tapOn:
    text: "Order Management"
- extendedWaitUntil:
    visible: "Order Management"
    timeout: 8000
- runFlow: helpers/cancel_b1_active_order.yaml
- tapOn:
    text: "Order Management"
- extendedWaitUntil:
    visible: "Order Management"
    timeout: 8000

- takeScreenshot: "qa_07_step2_order_management_clean"

# ── STEP 3: Create fresh B-1 order → CONFIRMED ───────────────────────────────
- tapOn:
    text: "+ New Order"
- extendedWaitUntil:
    visible: "Select Table"
    timeout: 10000
- tapOn:
    text: "B-1"

# Handle GuestCountModal if B-1 is free
- runFlow:
    when:
      visible:
        id: "btn-guest-confirm"
    commands:
      - tapOn:
          id: "btn-guest-confirm"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Mains"
    timeout: 10000

# Beef Burger + Extra modifier
- tapOn:
    text: "Beef Burger"
- extendedWaitUntil:
    visible: "Protein"
    timeout: 8000
- tapOn:
    text: "Extra"
- tapOn:
    text: "Add to Cart"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Beef Burger"
    timeout: 8000

# Garlic Bread (no modifier)
- tapOn:
    text: "Garlic Bread"
- waitForAnimationToEnd

# Send to Kitchen
- tapOn:
    text: "Send to Kitchen"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "CONFIRMED"
    timeout: 15000

- takeScreenshot: "qa_07_step3_b1_order_confirmed"

# ── STEP 4: Kitchen Operations — B-1 is the ONLY ticket ──────────────────────
- tapOn:
    text: "Kitchen Operations"
- extendedWaitUntil:
    visible: "Kitchen Display"
    timeout: 15000

- takeScreenshot: "qa_07_step4_kitchen_with_b1"

# QA: Only B-1 ticket visible, showing Beef Burger
- extendedWaitUntil:
    visible: "Beef Burger"
    timeout: 10000
- assertVisible: "Beef Burger"

- takeScreenshot: "qa_07_step5_b1_ticket_visible"

# ── STEP 5: CONFIRMED → PREPARING ────────────────────────────────────────────
# Use testID to avoid matching the stats bar "Start" label
- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-start"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-start"
- waitForAnimationToEnd

- takeScreenshot: "qa_07_step6_start_tapped"

- extendedWaitUntil:
    visible: "PREPARING"
    timeout: 8000
- assertVisible: "PREPARING"

- takeScreenshot: "qa_07_step7_status_preparing"

# ── STEP 6: PREPARING → READY ────────────────────────────────────────────────
# Use testID — "Ready" text also appears in the stats bar, causing tap ambiguity
- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-ready"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-ready"
- waitForAnimationToEnd

- takeScreenshot: "qa_07_step8_ready_tapped"

- extendedWaitUntil:
    visible: "READY"
    timeout: 8000

- takeScreenshot: "qa_07_step9_status_ready"

# ── STEP 7: READY → SERVED ───────────────────────────────────────────────────
# Use testID — wait for card to re-render with "Served" button
- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-served"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-served"
- waitForAnimationToEnd

- takeScreenshot: "qa_07_step10_served_tapped"

# ── STEP 8: Verify SERVED in Order Management ────────────────────────────────
- tapOn:
    text: "Order Management"
- extendedWaitUntil:
    visible: "Order Management"
    timeout: 10000

- takeScreenshot: "qa_07_step11_order_management"

- extendedWaitUntil:
    visible: "SERVED"
    timeout: 10000
- assertVisible: "SERVED"

- takeScreenshot: "qa_07_PASS_order_served_verified"
