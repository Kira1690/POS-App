appId: host.exp.exponent
name: "01 - Staff Login Offline (EMP001)"
tags:
  - offline
  - auth
---

# Test: Staff member can log in fully offline with dummy credentials
# Credential: EMP001 / staff123 (John Doe - Restaurant Staff)

- openLink: "exp://192.168.1.9:8081"

# Wait for welcome screen
- extendedWaitUntil:
    visible: "Welcome to FoodPOS"
    timeout: 90000

# Navigate to staff login
- tapOn:
    text: ".*Continue as Staff Member.*"

# Wait for staff login screen
- extendedWaitUntil:
    visible: "Staff Login"
    timeout: 10000

# Fill in credentials
- tapOn:
    id: "employee-id-input"
- inputText: "EMP001"

- tapOn:
    id: "password-input"
- inputText: "staff123"

# Dismiss keyboard before tapping button
- hideKeyboard

# Tap the blue login button (text includes emoji)
- tapOn:
    text: ".*Clock In.*"

# Wait for dashboard (login + navigation may take time)
- extendedWaitUntil:
    visible: "Staff Dashboard"
    timeout: 30000

- assertVisible: "Staff Dashboard"
- takeScreenshot: "01_staff_login_success"
