appId: com.ajinkya123.POSReactNativeApp
name: "CC from guest dialog"
---
# Guest dialog showing — confirm
- tapOn: "Confirm"
- waitForAnimationToEnd

# POS screen
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 30000
- tapOn: "Garlic Bread"
- waitForAnimationToEnd
- tapOn: "Classic Cheeseburger"
- waitForAnimationToEnd
- tapOn:
    id: "btn-cart-send-to-kitchen"
- waitForAnimationToEnd

# Open order
- extendedWaitUntil:
    visible: "Confirmed"
    timeout: 10000
- tapOn: "Confirmed"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "$21.44"
    timeout: 10000
- tapOn:
    text: ".*21\\.44.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000

# Status chain
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Preparing"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Ready"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Served"
- waitForAnimationToEnd

# Payment
- tapOn: "Process Payment"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Pay $21.44"
    timeout: 10000
- tapOn: "Pay $21.44"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Card Payment"
    direction: DOWN
    timeout: 10000
- tapOn: "Card Payment"
- waitForAnimationToEnd

# TRX
- extendedWaitUntil:
    visible: "TRX Terminal Payment"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "btn-trx-charge"
    timeout: 30000
- takeScreenshot: /tmp/e2e_cc_500_trx
- tapOn:
    id: "btn-trx-charge"
- waitForAnimationToEnd
- takeScreenshot: /tmp/e2e_cc_501_processing
- extendedWaitUntil:
    visible: "Payment Details"
    timeout: 180000
- takeScreenshot: /tmp/e2e_cc_502_complete
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: /tmp/e2e_cc_503_details
- tapOn: "Continue"
- waitForAnimationToEnd
