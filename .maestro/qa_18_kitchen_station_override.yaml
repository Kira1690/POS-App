appId: host.exp.exponent
name: "QA 18: Kitchen Station Override — Per-Item Station Assignment"
tags:
  - qa
  - menu-management
  - kitchen
---

# ─────────────────────────────────────────────────────
#  QA Phase 18 — Kitchen Station Override (per-item)
#
#  Tests the new per-item kitchen station picker added to
#  EditMenuItemModal > Basic tab. Verifies:
#
#  TC-1: Tab navigation — all 4 tabs reachable by testID
#  TC-2: Station picker UI — Auto chip visible on Basic tab
#  TC-3: Override station — Garlic Bread → Hot Kitchen → Save → persist
#  TC-4: Revert station  — Garlic Bread → Auto → Save → persist
#  TC-5: Override station — Latte (Drinks) → Cold Kitchen → Save → persist
#  TC-6: Revert Latte    — Latte (Cold Kitchen) → Auto → Save → persist
#  TC-7: POS + Kitchen routing — Garlic Bread (Hot Kitchen override)
#          add to order → send to kitchen → ticket appears in kitchen
#
#  testIDs used (EditMenuItemModal):
#    tab-edit-item-basic         — Basic info tab
#    tab-edit-item-pricing       — Pricing tab
#    tab-edit-item-modifiers     — Modifiers tab
#    tab-edit-item-nutritional   — Nutrition tab
#    input-edit-item-name        — Item name input
#    btn-station-auto            — "Auto" station chip
#    btn-station-hot_kitchen     — Hot Kitchen chip
#    btn-station-cold_kitchen    — Cold Kitchen chip
#    btn-station-cold_kitchen    — Cold Kitchen chip (used in TC-5)
#    btn-station-grill           — Grill chip
#    btn-station-desserts        — Desserts chip
#    btn-station-bar             — Bar chip
#    btn-save-item-changes       — Save Changes button
#    btn-cancel-edit-item        — Cancel button
#
#  testIDs used (MenuItemCard):
#    btn-edit-item-{slug}        — Edit pencil icon per card
#    btn-assign-modifiers-{slug} — Assign modifiers icon per card
#
#  Slug formula: item.name.toLowerCase().replace(/\s+/g, '-')
#    "Garlic Bread" → "garlic-bread"
#    "Latte"        → "latte"
#    "Beef Burger"  → "beef-burger"
#
#  Prerequisites: qa_01 + qa_02 completed
#    (Drinks/Mains/Starters categories + 6 items exist)
#
#  QA Assertions:
#    ✓ Edit modal opens for Garlic Bread
#    ✓ All 4 tabs reachable via testID
#    ✓ Kitchen Station section visible on Basic tab
#    ✓ Auto chip is selected by default (btn-station-auto)
#    ✓ Hot Kitchen chip selectable (btn-station-hot_kitchen)
#    ✓ Save → modal closes → reopen → Hot Kitchen still selected
#    ✓ Auto chip resets station to undefined
#    ✓ Save → reopen → Auto chip selected again
#    ✓ Latte: Cold Kitchen chip selectable and persists
#    ✓ Latte: reverts to Auto correctly
#    ✓ Kitchen display shows Garlic Bread ticket after POS order
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

# ── Navigate to Settings → Menu Management → Items tab ───────────────────────
- tapOn:
    id: "tab-nav-settings"
- extendedWaitUntil:
    visible:
      id: "settings-nav-restaurant_profile"
    timeout: 10000
# tapOn auto-scrolls the sidebar to find the item
- tapOn:
    id: "settings-nav-menu_management"
- extendedWaitUntil:
    visible:
      id: "tab-menu-items"
    timeout: 10000
- tapOn:
    id: "tab-menu-items"
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000

- takeScreenshot: "qa_18_step0_items_list"

# ════════════════════════════════════════════════════
# TC-1: Tab Navigation — verify all 4 tabs reachable
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd

- takeScreenshot: "qa_18_tc1_modal_open"

# Verify Basic tab is default (active)
- assertVisible: "Kitchen Station"

# Navigate to Pricing tab via testID
- tapOn:
    id: "tab-edit-item-pricing"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Selling Price"
    timeout: 6000
- assertVisible: "Selling Price"

- takeScreenshot: "qa_18_tc1_pricing_tab"

# Navigate to Modifiers tab via testID
- tapOn:
    id: "tab-edit-item-modifiers"
- waitForAnimationToEnd
- takeScreenshot: "qa_18_tc1_modifiers_tab"

# Navigate to Nutritional tab via testID
- tapOn:
    id: "tab-edit-item-nutritional"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Calories"
    timeout: 6000
- assertVisible: "Calories"

- takeScreenshot: "qa_18_tc1_nutritional_tab"

# Return to Basic tab
- tapOn:
    id: "tab-edit-item-basic"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- takeScreenshot: "qa_18_tc1_PASS_all_tabs_reachable"

# ════════════════════════════════════════════════════
# TC-2: Station picker — Auto chip visible, selected by default
# ════════════════════════════════════════════════════

# Verify "Kitchen Station" label visible
- assertVisible: "Kitchen Station"

# Verify Auto chip is present
- assertVisible: "Auto"

# Verify Auto chip is visible by testID
- extendedWaitUntil:
    visible:
      id: "btn-station-auto"
    timeout: 6000

- takeScreenshot: "qa_18_tc2_PASS_auto_chip_visible"

# Cancel (we will edit next)
- tapOn:
    id: "btn-cancel-edit-item"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 15000

# ════════════════════════════════════════════════════
# TC-3: Override Garlic Bread → Hot Kitchen → Save → persists
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd

# Should be on Basic tab by default
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- takeScreenshot: "qa_18_tc3_edit_open_auto_selected"

# Tap Hot Kitchen chip (btn-station-hot_kitchen)
- tapOn:
    id: "btn-station-hot_kitchen"
- waitForAnimationToEnd

- takeScreenshot: "qa_18_tc3_hot_kitchen_selected"

# Verify Hot Kitchen is now highlighted (text visible)
- assertVisible: "Hot Kitchen"

# Save the item
- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000
- assertVisible: "Garlic Bread"

- takeScreenshot: "qa_18_tc3_saved_back_to_list"

# ── Reopen to verify persistence ─────────────────────
- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

# Verify Hot Kitchen chip is selected (text visible, Auto chip not selected)
- assertVisible: "Hot Kitchen"

- takeScreenshot: "qa_18_tc3_PASS_hot_kitchen_persists"

# ════════════════════════════════════════════════════
# TC-4: Revert Garlic Bread → Auto → Save → persists
# ════════════════════════════════════════════════════

# (Modal still open from TC-3 verification)
# Tap Auto chip to revert
- tapOn:
    id: "btn-station-auto"
- waitForAnimationToEnd

# Verify Auto text is showing
- assertVisible: "Auto"

- takeScreenshot: "qa_18_tc4_auto_chip_tapped"

# Save
- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000

# Reopen to verify Auto is restored
- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

# Auto chip should be selected — assertVisible on "Auto" text
- assertVisible: "Auto"

- takeScreenshot: "qa_18_tc4_PASS_reverted_to_auto"

# Close modal
- tapOn:
    id: "btn-cancel-edit-item"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 15000

# ════════════════════════════════════════════════════
# TC-5: Override Latte (Drinks) → Cold Kitchen → Save → persists
# Cold Kitchen chip center is at ~324dp — visible on 360dp screen, no scroll needed
# ════════════════════════════════════════════════════
- extendedWaitUntil:
    visible: "Latte"
    timeout: 15000

- tapOn:
    id: "btn-edit-item-latte"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- takeScreenshot: "qa_18_tc5_latte_edit_open"

- tapOn:
    id: "btn-station-cold_kitchen"
- waitForAnimationToEnd

- takeScreenshot: "qa_18_tc5_cold_kitchen_selected"

# Save
- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Latte"
    timeout: 10000

# Reopen to verify
- tapOn:
    id: "btn-edit-item-latte"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- assertVisible: "Cold Kitchen"

- takeScreenshot: "qa_18_tc5_PASS_cold_kitchen_persists"

# ════════════════════════════════════════════════════
# TC-6: Revert Latte (Cold Kitchen) → Auto → Save → persists
# ════════════════════════════════════════════════════

# (Modal still open)
- tapOn:
    id: "btn-station-auto"
- waitForAnimationToEnd
- assertVisible: "Auto"

- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Latte"
    timeout: 10000

# Verify revert
- tapOn:
    id: "btn-edit-item-latte"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- assertVisible: "Auto"

- takeScreenshot: "qa_18_tc6_PASS_latte_reverted_to_auto"

# Close
- tapOn:
    id: "btn-cancel-edit-item"
- waitForAnimationToEnd

# ════════════════════════════════════════════════════
# TC-7: POS + Kitchen routing — Garlic Bread override to Hot Kitchen
#        Set override → create order → send to kitchen → verify ticket
# ════════════════════════════════════════════════════

# Step 7a: Set Garlic Bread → Hot Kitchen (persistent override for kitchen test)
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 15000
- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- tapOn:
    id: "btn-station-hot_kitchen"
- waitForAnimationToEnd
- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000

- takeScreenshot: "qa_18_tc7_garlic_bread_set_hot_kitchen"

# Step 7b: Clear any existing B-1 active orders
- tapOn:
    text: "Order Management"
- extendedWaitUntil:
    visible: "Order Management"
    timeout: 10000
- runFlow: helpers/cancel_b1_active_order.yaml

- takeScreenshot: "qa_18_tc7_orders_cleared"

# Step 7c: Create fresh B-1 order with Garlic Bread
- tapOn:
    text: "+ New Order"
- extendedWaitUntil:
    visible: "Select Table"
    timeout: 10000
- tapOn:
    text: "B-1"
- extendedWaitUntil:
    visible: "Starters"
    timeout: 10000

# Navigate to Starters category and add Garlic Bread
- tapOn:
    text: "Starters"
- waitForAnimationToEnd
- tapOn:
    text: "Garlic Bread"
- waitForAnimationToEnd

# Send to Kitchen
- tapOn:
    text: "Send to Kitchen"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "CONFIRMED"
    timeout: 15000

- takeScreenshot: "qa_18_tc7_order_confirmed"

# Step 7d: Verify ticket appears in Kitchen Operations
- tapOn:
    text: "Kitchen Operations"
- extendedWaitUntil:
    visible: "Kitchen Display"
    timeout: 15000
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 12000
- assertVisible: "Garlic Bread"

- takeScreenshot: "qa_18_tc7_PASS_garlic_bread_in_kitchen"

# ── Cleanup: Advance ticket to SERVED so kitchen is clean ────────────────────
- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-start"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-start"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-ready"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-ready"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "btn-kitchen-action-served"
    timeout: 10000
- tapOn:
    id: "btn-kitchen-action-served"
- waitForAnimationToEnd

- takeScreenshot: "qa_18_tc7_ticket_served"

# ── Cleanup: Revert Garlic Bread back to Auto ─────────────────────────────────
- tapOn:
    text: "Settings"
- extendedWaitUntil:
    visible: "Menu Management"
    timeout: 15000
- tapOn:
    text: "Menu Management"
- extendedWaitUntil:
    visible: "Items"
    timeout: 10000
- tapOn:
    text: "Items"
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000

- tapOn:
    id: "btn-edit-item-garlic-bread"
- extendedWaitUntil:
    visible:
      id: "tab-edit-item-basic"
    timeout: 15000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Kitchen Station"
    timeout: 6000

- tapOn:
    id: "btn-station-auto"
- waitForAnimationToEnd
- tapOn:
    id: "btn-save-item-changes"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 10000

# ── FINAL ASSERTIONS ─────────────────────────────────
- assertVisible: "Garlic Bread"
- assertVisible: "Latte"
- assertVisible: "Cappuccino"
- assertVisible: "Beef Burger"

- takeScreenshot: "qa_18_PASS_all_items_visible_stations_clean"

# ─────────────────────────────────────────────────────
#  QA 18 COMPLETE
#  TC-1 ✅ All 4 tabs reachable by testID
#  TC-2 ✅ Auto chip visible on Basic tab
#  TC-3 ✅ Hot Kitchen override saves and persists
#  TC-4 ✅ Auto chip reverts station correctly
#  TC-5 ✅ Cold Kitchen override on Latte persists
#  TC-6 ✅ Latte reverts to Auto correctly
#  TC-7 ✅ Kitchen ticket appears after POS order with overridden station
# ─────────────────────────────────────────────────────
