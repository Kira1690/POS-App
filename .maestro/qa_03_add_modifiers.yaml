appId: com.ajinkya123.POSReactNativeApp
name: "QA 03: Add Modifier Groups (Cup Size / Protein)"
tags:
  - qa
  - menu-setup
  - modifiers
---

# ─────────────────────────────────────────────────────
#  QA Phase 3 — Create 2 modifier groups with options
#
#  Group 1: Cup Size  — Small $0 / Medium +$0.75 / Large +$1.50
#  Group 2: Protein   — Regular $0 / Extra +$2.00
#
#  CRITICAL rules:
#    - NEVER tapOn: label: for TextInputs → opens Google Search
#    - ALWAYS use tapOn: id: (testID) for TextInputs and icon buttons
#    - ALWAYS use tapOn: id: "btn-save-modifier-option" to submit option form
#    - DO NOT hideKeyboard before tapping btn-save-modifier-option
#      The save button is ABOVE the keyboard (confirmed in screenshots).
#      After hideKeyboard, the KAV animates the modal DOWN, causing the
#      save button coordinates to be unstable — the tap misses.
#      Keep the keyboard visible; the button is always accessible above it.
#    - After saving an option, use extendedWaitUntil visible btn-add-option
#      before tapping — modal close animation temporarily removes it from tree
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

- waitForAnimationToEnd

- tapOn:
    id: "tab-nav-settings"

- extendedWaitUntil:
    visible:
      id: "settings-nav-menu_management"
    timeout: 10000

# tapOn auto-scrolls the sidebar to find the item
- tapOn:
    id: "settings-nav-menu_management"

- extendedWaitUntil:
    visible:
      id: "tab-menu-items"
    timeout: 10000

- tapOn:
    id: "tab-menu-modifiers"

- extendedWaitUntil:
    visible: "Add Group"
    timeout: 8000

- takeScreenshot: "qa_03_step1_modifiers_tab"

# ── Clear any modifier groups from previous test runs ──
- runFlow: helpers/clear_modifier_groups.yaml

- waitForAnimationToEnd

# ════════════════════════════════════════════════════
# GROUP 1: Cup Size
# ════════════════════════════════════════════════════
- tapOn:
    text: "Add Group"

- extendedWaitUntil:
    visible: "Group Name *"
    timeout: 8000

- tapOn:
    id: "input-modifier-group-name"

- inputText: "Cup Size"

- hideKeyboard

- waitForAnimationToEnd

- takeScreenshot: "qa_03_cup_size_config"

- tapOn:
    text: "Create Group"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Cup Size"
    timeout: 10000

- assertVisible: "Cup Size"

- takeScreenshot: "qa_03_cup_size_group_created"

# ── Option 1: Small — $0.00 ──
# Wait for btn-add-option to be in accessibility tree before tapping
- extendedWaitUntil:
    visible:
      id: "btn-add-option"
    timeout: 10000

- tapOn:
    id: "btn-add-option"

- extendedWaitUntil:
    visible: "Add Option"
    timeout: 8000

- tapOn:
    id: "input-modifier-option-name"

- inputText: "Small"

# NOTE: Do NOT hideKeyboard here — save button is ABOVE keyboard.
# Tapping save while keyboard is up avoids KAV animation timing issues.
- tapOn:
    id: "btn-save-modifier-option"

- extendedWaitUntil:
    notVisible: "Add Option"
    timeout: 12000

- extendedWaitUntil:
    visible: "Small"
    timeout: 8000

- waitForAnimationToEnd

- takeScreenshot: "qa_03_cup_size_small_added"

# ── Option 2: Medium — +$0.75 ──
- extendedWaitUntil:
    visible:
      id: "btn-add-option"
    timeout: 10000

- tapOn:
    id: "btn-add-option"

- extendedWaitUntil:
    visible: "Add Option"
    timeout: 8000

- tapOn:
    id: "input-modifier-option-name"

- inputText: "Medium"

# Move to price field (keyboard stays open, focus moves)
- tapOn:
    id: "input-modifier-option-price"

- eraseText: 3

- inputText: "0.75"

# Tap save with keyboard still visible (button above keyboard)
- tapOn:
    id: "btn-save-modifier-option"

- extendedWaitUntil:
    notVisible: "Add Option"
    timeout: 12000

- extendedWaitUntil:
    visible: "Medium"
    timeout: 8000

- waitForAnimationToEnd

- takeScreenshot: "qa_03_cup_size_medium_added"

# ── Option 3: Large — +$1.50 ──
- extendedWaitUntil:
    visible:
      id: "btn-add-option"
    timeout: 10000

- tapOn:
    id: "btn-add-option"

- extendedWaitUntil:
    visible: "Add Option"
    timeout: 8000

- tapOn:
    id: "input-modifier-option-name"

- inputText: "Large"

# Move to price field (keyboard stays open, focus moves)
- tapOn:
    id: "input-modifier-option-price"

- eraseText: 3

- inputText: "1.50"

# Tap save with keyboard still visible (button above keyboard)
- tapOn:
    id: "btn-save-modifier-option"

- extendedWaitUntil:
    notVisible: "Add Option"
    timeout: 12000

- extendedWaitUntil:
    visible: "Large"
    timeout: 8000

- waitForAnimationToEnd

- takeScreenshot: "qa_03_PASS_cup_size_complete"

# ════════════════════════════════════════════════════
# GROUP 2: Protein
# ════════════════════════════════════════════════════
- tapOn:
    text: "Add Group"

- extendedWaitUntil:
    visible: "Group Name *"
    timeout: 8000

- tapOn:
    id: "input-modifier-group-name"

- inputText: "Protein"

- hideKeyboard

- waitForAnimationToEnd

- tapOn:
    text: "Create Group"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Protein"
    timeout: 10000

- assertVisible: "Protein"

- takeScreenshot: "qa_03_protein_group_created"

# ── Option 1: Regular — $0.00 (index 1 = Protein card) ──
- extendedWaitUntil:
    visible:
      id: "btn-add-option"
    timeout: 10000

- tapOn:
    id: "btn-add-option"
    index: 1

- extendedWaitUntil:
    visible: "Add Option"
    timeout: 8000

- tapOn:
    id: "input-modifier-option-name"

- inputText: "Regular"

# Tap save with keyboard visible (button above keyboard)
- tapOn:
    id: "btn-save-modifier-option"

- extendedWaitUntil:
    notVisible: "Add Option"
    timeout: 12000

- extendedWaitUntil:
    visible: "Regular"
    timeout: 8000

- waitForAnimationToEnd

- takeScreenshot: "qa_03_protein_regular_added"

# ── Option 2: Extra — +$2.00 ──
- extendedWaitUntil:
    visible:
      id: "btn-add-option"
    timeout: 10000

- tapOn:
    id: "btn-add-option"
    index: 1

- extendedWaitUntil:
    visible: "Add Option"
    timeout: 8000

- tapOn:
    id: "input-modifier-option-name"

- inputText: "Extra"

# Move to price field (keyboard stays open, focus moves)
- tapOn:
    id: "input-modifier-option-price"

- eraseText: 3

- inputText: "2.00"

# Tap save with keyboard visible (button above keyboard)
- tapOn:
    id: "btn-save-modifier-option"

- extendedWaitUntil:
    notVisible: "Add Option"
    timeout: 12000

- extendedWaitUntil:
    visible: "Extra"
    timeout: 8000

- takeScreenshot: "qa_03_protein_extra_added"

# ── FINAL QA ──────────────────────────────────────────
- assertVisible: "Cup Size"
- assertVisible: "Protein"

- takeScreenshot: "qa_03_PASS_both_modifier_groups"
