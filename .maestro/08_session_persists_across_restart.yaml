appId: host.exp.exponent
name: "08 - Session Persists Across App Restart"
tags:
  - offline
  - session
---

# Test: Session persists in SQLite across app restart (24h expiry)

- openLink: "exp://10.0.2.2:8081"

# Login as staff
- extendedWaitUntil:
    visible: "Welcome to FoodPOS"
    timeout: 30000

- tapOn: "Continue as Staff Member"

- extendedWaitUntil:
    visible: "Staff Login"
    timeout: 10000

- tapOn:
    id: "employee-id-input"
- inputText: "EMP001"

- tapOn:
    id: "password-input"
- inputText: "staff123"

- tapOn: "Clock In"

- extendedWaitUntil:
    visible: "Staff Dashboard"
    timeout: 15000

- takeScreenshot: "08a_logged_in_first_time"

# Relaunch via deep link (session should persist)
- openLink: "exp://10.0.2.2:8081"

# Should auto-login to dashboard without showing login screen
- extendedWaitUntil:
    visible:
      anyOf:
        - "Staff Dashboard"
        - "Dashboard"
    timeout: 20000

- takeScreenshot: "08b_session_persisted_after_restart"
