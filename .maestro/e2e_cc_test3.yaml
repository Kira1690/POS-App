appId: com.ajinkya123.POSReactNativeApp
name: "CC Surcharge Test v3"
---
# Wait for tables to load
- extendedWaitUntil:
    visible: "M5-197q"
    timeout: 20000
- waitForAnimationToEnd

# Pick M5
- tapOn: "M5-197q"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "Confirm"
    commands:
      - tapOn: "Confirm"
      - waitForAnimationToEnd

# Menu
- extendedWaitUntil:
    visible: "Garlic Bread"
    timeout: 30000
- tapOn: "Garlic Bread"
- waitForAnimationToEnd
- tapOn: "Classic Cheeseburger"
- waitForAnimationToEnd
- tapOn:
    id: "btn-cart-send-to-kitchen"
- waitForAnimationToEnd

# Open the new confirmed order
- extendedWaitUntil:
    visible: "Confirmed"
    timeout: 10000
- tapOn: "Confirmed"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "$21.44"
    timeout: 10000
- tapOn:
    text: ".*21\\.44.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000

# Status chain
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Preparing"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Ready"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Update Status"
    timeout: 10000
- tapOn: "Update Status"
- waitForAnimationToEnd
- tapOn: "Served"
- waitForAnimationToEnd

# Payment flow
- tapOn: "Process Payment"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Pay $21.44"
    timeout: 10000
- tapOn: "Pay $21.44"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Card Payment"
    direction: DOWN
    timeout: 10000
- tapOn: "Card Payment"
- waitForAnimationToEnd

# TRX modal
- extendedWaitUntil:
    visible: "TRX Terminal Payment"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "btn-trx-charge"
    timeout: 30000
- takeScreenshot: /tmp/e2e_cc_300_trx_ready

# Charge
- tapOn:
    id: "btn-trx-charge"
- waitForAnimationToEnd
- takeScreenshot: /tmp/e2e_cc_301_processing

# Wait for swipe
- extendedWaitUntil:
    visible: "Payment Details"
    timeout: 180000
- takeScreenshot: /tmp/e2e_cc_302_complete
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: /tmp/e2e_cc_303_details
- tapOn: "Continue"
- waitForAnimationToEnd
