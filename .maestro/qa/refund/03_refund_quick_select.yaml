appId: com.ajinkya123.POSReactNativeApp
name: "MR-03 Quick Select 75%"
tags:
  - refund
  - sprint4
---

- runFlow: ../../helpers/online/manager_login.yaml
- runFlow: ../../helpers/create_paid_order.yaml

# Navigate to paid order
- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "paid"
    direction: DOWN
    timeout: 10000
- tapOn:
    text: "paid"
    index: 0
- waitForAnimationToEnd

# Open Refund Modal
- extendedWaitUntil:
    visible:
      id: "btn-refund-order"
    timeout: 5000
- tapOn:
    id: "btn-refund-order"

- extendedWaitUntil:
    visible:
      id: "refund-state-form"
    timeout: 5000

# Toggle partial mode
- tapOn:
    id: "btn-refund-partial-toggle"

# Tap 25% first to verify it works
- tapOn:
    id: "btn-refund-quick-25"
- takeScreenshot: sprint4/MR-03_quick_25

# Then tap 75%
- tapOn:
    id: "btn-refund-quick-75"
- takeScreenshot: sprint4/MR-03_quick_75

# Select reason and submit
- tapOn:
    id: "btn-refund-reason-0"
- tapOn:
    id: "btn-refund-submit"

# Verify success
- extendedWaitUntil:
    visible:
      id: "refund-state-success"
    timeout: 15000

- takeScreenshot: sprint4/MR-03_quick_select_success
