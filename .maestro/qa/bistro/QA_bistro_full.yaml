    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    text: "Occupied|Available|M1.*|P1.*|B1.*"
    optional: true
- takeScreenshot: "QA_24_web_table_status_synced"

# QA_25 — Modifier synced (open any item in POS)
