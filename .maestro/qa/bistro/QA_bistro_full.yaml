    text: "Order Management"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*New Order.*"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    text: "B1.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-existing-update-order"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Desserts"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Chocolate Lava Cake"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "QA_25_modifier_synced"
- tapOn:
    text: "Cancel|Close|Back|Done|Add"
    optional: true
- waitForAnimationToEnd

# QA_26 — Create Bar order (Espresso) for web sync check
- tapOn:
    text: "Beverages"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Espresso"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Add|Confirm|OK|Done"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*Send.*Kitchen.*|.*Place.*Order.*|Send|Kitchen"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: "QA_26_bar_order_to_web"

# ─────────────────────────────────────────────────────────────
# GROUP F — Customers & Reports (QA_27–QA_30)
# ─────────────────────────────────────────────────────────────

# QA_27 — Create order on M2 (for sync verification)
# Note: Customer creation not available on ordering screen (table-based orders)
# Navigate directly from QA_26 (no launchApp — causes tab detection issues)
- tapOn:
    id: "tab-nav-orders"
    optional: true
- tapOn:
    text: "Order Management"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: ".*New Order.*"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    text: "M2.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-existing-update-order"
    optional: true
- waitForAnimationToEnd
# Add Appetizers
- tapOn:
    text: "Appetizers"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Garlic Bread|Spring Rolls"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Add|Confirm|OK|Done"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "QA_27_m2_order_items"

# QA_28 — Send M2 order to kitchen
- tapOn:
    text: ".*Send.*Kitchen.*|.*Place.*Order.*|Send|Kitchen"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- takeScreenshot: "QA_28_m2_order_sent"

# QA_29 — Reports screen (via Dashboard bottom tab → Reports sidebar item)
# Navigate directly from QA_28 (no launchApp — testIDs/text fail after launchApp)
# After QA_28, we're on Order Management screen. Tap Dashboard bottom tab.
- tapOn:
    id: "tab-nav-dashboard"
    optional: true
- tapOn:
    text: "Dashboard"
    optional: true
