# QA_30 — Final floor plan: all table statuses (via Dashboard sidebar)
- tapOn:
    text: "Tables"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    text: "Table.*Summary|Occupied|Available"
    optional: true
- takeScreenshot: "QA_30_final_floor_plan"
