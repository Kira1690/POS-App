appId: host.exp.exponent
name: "QA 09 — Reports Screen (Real API Data)"
tags:
  - qa
  - pos
---

# Login as manager (online account that has real API data)
- runFlow: helpers/manager_login.yaml

- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000

- takeScreenshot: "qa_09_01_dashboard_loaded"

# ── Navigate to Reports tab ──────────────────────────────────────────────────
- tapOn:
    text: ".*Reports.*"

- extendedWaitUntil:
    visible: "Reports & Analytics"
    timeout: 20000

- takeScreenshot: "qa_09_02_reports_screen"

# ── Sales tab (default) ──────────────────────────────────────────────────────
# Verify Sales tab is active by default and KPI cards are present
- assertVisible: "Total Revenue"
- assertVisible: "Total Orders"

# Verify at least one non-zero value loaded (15 paid orders seeded)
- assertNotVisible: "No sales data for period"

- takeScreenshot: "qa_09_03_sales_tab_kpis"

# ── Period selector — switch to Week ─────────────────────────────────────────
- tapOn:
    text: "Week"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Total Revenue"
    timeout: 15000

- takeScreenshot: "qa_09_04_sales_week"

# ── Period selector — switch to Month ────────────────────────────────────────
- tapOn:
    text: "Month"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Total Revenue"
    timeout: 15000

- takeScreenshot: "qa_09_05_sales_month"

# ── Switch to Today ───────────────────────────────────────────────────────────
- tapOn:
    text: "Today"

- waitForAnimationToEnd

- takeScreenshot: "qa_09_06_sales_today"

# ── Items tab ────────────────────────────────────────────────────────────────
- tapOn:
    text: "Items"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Top Selling Items"
    timeout: 15000

- takeScreenshot: "qa_09_07_items_tab"

# Verify item table columns
- assertVisible: "Item"
- assertVisible: "Qty"
- assertVisible: "Revenue"

# At least one item should be present (Garlic Bread from seeded data)
- optional:
    - assertVisible: "Garlic Bread"

- takeScreenshot: "qa_09_08_items_table"

# ── Staff tab ─────────────────────────────────────────────────────────────────
- tapOn:
    text: "Staff"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Staff.*"
    timeout: 15000

# Staff tab may show empty state (test orders have no server_id — that's OK)
- takeScreenshot: "qa_09_09_staff_tab"

# Verify column headers are present regardless of data
- optional:
    - assertVisible: "Orders"
    - assertVisible: "Sales"

# ── Payments tab ──────────────────────────────────────────────────────────────
- tapOn:
    text: "Payments"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Payment.*"
    timeout: 15000

- takeScreenshot: "qa_09_10_payments_tab"

# ── Pull-to-refresh ───────────────────────────────────────────────────────────
# Go back to Sales tab and pull to refresh
- tapOn:
    text: "Sales"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Total Revenue"
    timeout: 10000

- scroll:
    direction: DOWN
    duration: 300

- scroll:
    direction: UP
    duration: 300

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Total Revenue"
    timeout: 15000

- takeScreenshot: "qa_09_11_after_refresh"

# ── Verify offline badge is NOT shown (we are online) ────────────────────────
- assertNotVisible: "Offline"

- takeScreenshot: "qa_09_12_no_offline_badge"
