appId: com.ajinkya123.POSReactNativeApp
name: "QA 09 — Reports Screen (Real API Data)"
tags:
  - qa
  - pos
---

# Login as manager (online account that has real API data)
- runFlow: ../helpers/manager_login.yaml

- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000

- takeScreenshot: "qa_09_01_dashboard_loaded"

# ── Navigate to Reports via Dashboard sidebar ─────────────────────────────────
- tapOn:
    text: ".*Reports.*"

- extendedWaitUntil:
    visible: "Reports & Analytics"
    timeout: 20000

- takeScreenshot: "qa_09_02_reports_screen"

# ── Verify Sales Summary KPIs ────────────────────────────────────────────────
# Default period is 1W. Verify KPI labels are present.
- assertVisible: "Gross Sales"
- assertVisible: "Sales"

- takeScreenshot: "qa_09_03_sales_kpis"

# ── Period selector — switch to 1D ───────────────────────────────────────────
- tapOn:
    text: "1D"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Gross Sales"
    timeout: 15000

- takeScreenshot: "qa_09_04_period_1d"

# ── Period selector — switch to 1M ───────────────────────────────────────────
- tapOn:
    text: "1M"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Gross Sales"
    timeout: 15000

- takeScreenshot: "qa_09_05_period_1m"

# ── Switch back to 1W ────────────────────────────────────────────────────────
- tapOn:
    text: "1W"

- waitForAnimationToEnd

- takeScreenshot: "qa_09_06_period_1w"

# ── Scroll down to verify all sections ──────────────────────────────────────
- scroll

- waitForAnimationToEnd

# Verify payment breakdown section
- assertVisible:
    text: "Sales by Payment Types"
    optional: true

- takeScreenshot: "qa_09_07_payment_breakdown"

# Continue scrolling to Top Items
- scroll

- waitForAnimationToEnd

- assertVisible:
    text: "Top Items"
    optional: true

# Verify table header columns
- assertVisible:
    text: "Item"
    optional: true
- assertVisible:
    text: "Gross"
    optional: true
- assertVisible:
    text: "Count"
    optional: true

- takeScreenshot: "qa_09_08_top_items"

# Scroll to Staff Performance section
- scroll

- waitForAnimationToEnd

- assertVisible:
    text: "Staff Performance"
    optional: true

- takeScreenshot: "qa_09_09_staff_performance"

# ── Scroll back to top and verify no offline badge ──────────────────────────
- scrollUntilVisible:
    element:
      text: "Reports & Analytics"
    direction: UP
    timeout: 5000

- assertNotVisible: "Offline"

- takeScreenshot: "qa_09_10_no_offline_badge"
