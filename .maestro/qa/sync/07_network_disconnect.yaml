appId: com.ajinkya123.POSReactNativeApp
name: "SY-14 — Offline → Reconnect → Auto-Sync"
# Tests the offline/reconnect flow:
# 1. App online → data loads and shows sync status
# 2. Navigates POS screens to verify data is present
# 3. Checks for online/sync status indicators
#
# NOTE: Actual WiFi toggle requires manual adb commands or a real device.
# On Android emulator, svc wifi disable does not block the virtual network.
# This test verifies the UI state when the app is online.
#
# Usage: maestro test POS-App/.maestro/qa/sync/07_network_disconnect.yaml

---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    text: ".*MANAGER.*"
    optional: true
- waitForAnimationToEnd

# Login
- tapOn:
    text: "Email"
    optional: true
- inputText: "qa-prod-manager@blueplate.io"
- tapOn:
    text: "Password"
    optional: true
- inputText: "QAProdMgr2026!"
- tapOn:
    text: ".*SIGN.*IN.*|.*Sign.*In.*|.*Login.*|.*LOGIN.*"
- waitForAnimationToEnd

# Verify online state — navigate to POS screen
- tapOn:
    text: "Orders|POS"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "network_01_online"

# Wait for sync to complete
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify app loaded and shows content (not stuck/loading)
- assertNotVisible:
    text: "Loading|Connecting"
    optional: true

- takeScreenshot: "network_02_app_loaded"

# Navigate back and check sync status
- tapOn:
    text: "Orders|POS"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "network_03_pos_screen"

# Verify order screen is functional
- assertVisible:
    text: "Table|Order|POS|Floor"
    optional: true

- takeScreenshot: "network_04_tables_visible"

# Navigate away and back to test state persistence
- tapOn:
    text: "Dashboard|Home"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Orders|POS"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "network_05_navigation_ok"

- stopApp
