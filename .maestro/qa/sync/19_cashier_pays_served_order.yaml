appId: com.ajinkya123.POSReactNativeApp
name: "SYNC-19: Cashier Pays Served Order — Full Payment Flow"
---

# Order ORD-20260318-9780 is now "served" (status advanced via API).
# Cashier logs in, finds the order, processes cash payment.
# After payment, verify order shows "paid" on mobile and web.

# ═══════════════════════════════════════════════
# LOGIN AS CASHIER
# ═══════════════════════════════════════════════
- runFlow:
    file: ../../helpers/online/cashier_login.yaml

- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19_cashier_orders_served

# ═══════════════════════════════════════════════
# TAP VIEW ON FIRST ORDER (should be our served order)
# ═══════════════════════════════════════════════
- tapOn:
    text: ".*View.*"
    index: 0
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19_cashier_order_detail_served

# ═══════════════════════════════════════════════
# SCROLL DOWN AND TAP PAY/BILL BUTTON
# The order should show payment option now that it's served
# ═══════════════════════════════════════════════
- scrollUntilVisible:
    element:
      id: "btn-order-pay"
    direction: DOWN
    timeout: 10000
    optional: true

# Try tapping the pay button by various selectors
- tapOn:
    id: "btn-order-pay"
    optional: true
- tapOn:
    text: ".*Pay.*|.*Bill.*|.*Payment.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19_cashier_bill_screen

# ═══════════════════════════════════════════════
# SELECT CASH PAYMENT
# ═══════════════════════════════════════════════
- tapOn:
    text: ".*Cash.*"
    index: 0
    optional: true
- waitForAnimationToEnd

# Process payment
- tapOn:
    id: "btn-process-payment"
    optional: true
- tapOn:
    text: ".*Process.*|.*Confirm.*|.*Pay Now.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Confirm cash amount
- tapOn:
    id: "btn-cash-confirm"
    optional: true
- tapOn:
    text: ".*Confirm.*|.*Complete.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19_cashier_payment_success

# Close/Continue
- tapOn:
    id: "btn-continue"
    optional: true
- tapOn:
    text: ".*Continue.*|.*Done.*|.*Close.*|.*Back.*|.*Receipt.*"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for push sync
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Navigate to orders tab to see paid status
- tapOn:
    id: "tab-nav-orders"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19_cashier_final_paid
