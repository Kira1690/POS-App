appId: com.ajinkya123.POSReactNativeApp
name: "SYNC-19d: Cashier Full Payment — Login → Find Served Order → Pay"
---

# Login as cashier, find the served order, process cash payment.

- runFlow:
    file: ../../helpers/online/cashier_login.yaml

- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_orders_list

# The served order should have a "Pay" button on its card
# Tap it directly
- tapOn:
    text: "Pay"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_bill_screen

# On Bill screen — tap the big "Pay $XX.XX" button at bottom
- tapOn:
    text: "Pay \\$.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_payment_method

# Tap Cash payment
- tapOn:
    text: "Cash"
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_cash_amount

# Process/Confirm the cash payment
- tapOn:
    id: "btn-process-payment"
    optional: true
- tapOn:
    id: "btn-cash-confirm"
    optional: true
- tapOn:
    text: ".*Confirm.*|.*Process.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_payment_result

# Continue/Done/Receipt
- tapOn:
    id: "btn-continue"
    optional: true
- tapOn:
    text: ".*Continue.*|.*Done.*|.*Receipt.*|.*View.*"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

# Wait for sync (12s)
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    id: "tab-nav-orders"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/19d_final
