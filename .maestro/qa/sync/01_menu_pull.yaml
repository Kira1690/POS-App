appId: com.ajinkya123.POSReactNativeApp
name: "QA Sync 01 — Menu Pull (Web → App)"
# Verifies: After creating a menu category on the web, it appears in the app within 30s.
# Pre-condition: Create "QA-Cat-Sync-01" on web /menu before running this test.

---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Login as qa-manager
- tapOn:
    id: "email-input"
- inputText: "qa-manager@blueplate2026.io"
- hideKeyboard
- tapOn:
    id: "password-input"
- inputText: "QAManager2026!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Navigate to POS order screen to see category sidebar
- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd
- takeScreenshot: "sync_menu_01_before_pull"

# Wait for pull sync interval (~30s) using 5x waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Reload / trigger sync
- waitForAnimationToEnd
- takeScreenshot: "sync_menu_02_after_30s"

# Verify new category appears
- assertVisible:
    text: "QA-Cat-Sync-01"
    optional: true  # Non-fatal — log result

- takeScreenshot: "sync_menu_03_category_visible"
- stopApp
