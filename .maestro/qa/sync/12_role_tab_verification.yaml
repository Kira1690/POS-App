appId: com.ajinkya123.POSReactNativeApp
name: "SYNC-12: Role Tab Verification — All 5 Store Roles"
---

# Phase A: Verify each role sees correct tabs on mobile.
# Tests RBAC tab visibility after 8-role overhaul.
#
# Expected:
#   waiter:        Dashboard + Orders (2 tabs)
#   kitchen_staff: Dashboard + Kitchen (2 tabs)
#   cashier:       Dashboard + Orders (2 tabs)
#   manager:       Dashboard + Orders + Kitchen + Settings (4 tabs)
#   store_admin:   Dashboard + Orders + Kitchen + Settings (4 tabs)

# ═══════════════════════════════════════════════
# TEST 1: WAITER — Dashboard + Orders only
# ═══════════════════════════════════════════════
- runFlow:
    file: ../../helpers/online/waiter_login.yaml

- assertVisible:
    id: "tab-nav-dashboard"
- assertVisible:
    id: "tab-nav-orders"
- assertNotVisible:
    id: "tab-nav-kitchen"
    optional: true
- assertNotVisible:
    id: "tab-nav-settings"
    optional: true

- takeScreenshot: screenshots/sync-test/01_waiter_tabs

