appId: com.ajinkya123.POSReactNativeApp
name: "QA Sync 03 — Order Full Lifecycle (App → Web)"
# Verifies: Complete order lifecycle from mobile creation to web visibility.
# Checks: order created → kitchen → paid, each step visible on web via WS broadcast.
# WS broadcast makes status changes instant — waitForAnimationToEnd is just for UI settling.
# Pre-condition: Tables and menu items must exist in app.

---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Login as manager
- tapOn:
    id: "email-input"
- inputText: "qa-manager@blueplate2026.io"
- hideKeyboard
- tapOn:
    id: "password-input"
- inputText: "QAManager2026!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

- takeScreenshot: "order_lifecycle_01_login"

# Navigate to Orders tab
- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd

# Create new order
- tapOn:
    id: "btn-new-order"
- waitForAnimationToEnd

# Select table B-1
- tapOn:
    id: "btn-table-select-B-1"
    optional: true
- waitForAnimationToEnd

# Confirm guest count
- tapOn:
    id: "btn-guest-confirm"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "order_lifecycle_02_table_selected"

# Add first menu item (tap first visible item)
- tapOn:
    text: ".*"
    index: 0
    optional: true
- waitForAnimationToEnd

# Handle modifier modal if it appears
- tapOn:
    text: "Add|OK|Done|Confirm"
    optional: true
- waitForAnimationToEnd

# Add second menu item
- tapOn:
    text: ".*"
    index: 1
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Add|OK|Done|Confirm"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "order_lifecycle_03_items_added"

# Send to Kitchen
- tapOn:
    id: "btn-cart-send-to-kitchen"
    optional: true
- waitForAnimationToEnd

# Confirm kitchen send
- tapOn:
    id: "btn-kitchen-modal-confirm"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "order_lifecycle_04_order_confirmed"

# WS broadcast makes this instant — waitForAnimationToEnd is just for UI settling
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Verify order is confirmed
- assertVisible:
    text: "B-1|confirmed|pending"
    optional: true
- takeScreenshot: "order_lifecycle_05_after_push_wait"

# Update status to Preparing (if available in UI)
- tapOn:
    text: "Preparing|Mark Preparing"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "preparing|Preparing"
    optional: true
- takeScreenshot: "order_lifecycle_06_preparing"

# Update status to Ready
- tapOn:
    text: "Ready|Mark Ready"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "ready|Ready"
    optional: true
- takeScreenshot: "order_lifecycle_07_ready"

# Update status to Served
- tapOn:
    text: "Served|Mark Served|Complete"
    optional: true
- waitForAnimationToEnd
- assertVisible:
    text: "served|Served|completed"
    optional: true
- takeScreenshot: "order_lifecycle_08_served"

# Process payment (Cash)
- tapOn:
    id: "btn-order-pay"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: "order_lifecycle_09_payment_screen"

- tapOn:
    text: "Cash"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: "btn-process-payment"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: "btn-cash-confirm"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "order_lifecycle_10_payment_complete"

# WS broadcast makes billing sync instant — waitForAnimationToEnd is just for UI settling
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    id: "btn-continue"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: "order_lifecycle_11_after_billing_push"
- stopApp
