appId: com.ajinkya123.POSReactNativeApp
name: "SYNC-20: Cashier Complete Cash Payment — Login to Paid"
---

# Full cashier payment flow in ONE file (no app restart between steps).
# Order ORD-20260318-9780 is SERVED. Cashier pays with cash.

# ═══ LOGIN ═══
- runFlow:
    file: ../../helpers/online/cashier_login.yaml

# ═══ NAVIGATE TO ORDERS ═══
- tapOn:
    id: "tab-nav-orders"
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_orders_list

# ═══ TAP PAY ON SERVED ORDER ═══
- tapOn:
    text: "Pay"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_bill_screen

# ═══ TAP PAY $XX.XX BUTTON ON BILL ═══
- tapOn:
    text: "Pay \\$.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_payment_processing

# ═══ SELECT CASH METHOD ═══
# Need to scroll down past tip section
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd

- tapOn:
    text: ".*Cash.*"
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_cash_modal

# ═══ TAP QUICK AMOUNT $70.00 ═══
- tapOn:
    text: ".*70.*"
    index: 0
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_cash_70_entered

# ═══ CONFIRM PAYMENT ═══
- tapOn:
    text: "Confirm Payment"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_payment_confirmed

# ═══ HANDLE SUCCESS SCREEN ═══
- tapOn:
    id: "btn-continue"
    optional: true
- tapOn:
    text: ".*Continue.*|.*Done.*|.*View Receipt.*|.*New Order.*|.*Back to Orders.*"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_success

# ═══ SYNC WAIT (12s) ═══
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# ═══ CHECK FINAL STATE ═══
- tapOn:
    id: "tab-nav-orders"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "btn-refresh-orders"
    optional: true
- waitForAnimationToEnd
- waitForAnimationToEnd

- takeScreenshot: screenshots/sync-test/20_final_paid_orders
