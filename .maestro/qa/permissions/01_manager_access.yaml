appId: com.ajinkya123.POSReactNativeApp
name: "QA Permissions 01 — Manager Access"
# Verifies: manager role has access to Orders, Tables, Kitchen, Settings (management level)

---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Login as manager using testIDs
- tapOn:
    id: "email-input"
- inputText: "qa-manager@blueplate2026.io"
- tapOn:
    id: "password-input"
- inputText: "QAManager2026!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

# Assert Order Management loaded (default screen after login)
- assertVisible:
    text: ".*Order Management.*|.*Orders.*"
- takeScreenshot: "manager_01_order_management"

# Verify Dashboard tab accessible
- tapOn:
    text: "Dashboard"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized|403"
- takeScreenshot: "manager_02_dashboard"

# Verify Order Management tab accessible
- tapOn:
    text: "Order Management"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "manager_03_orders"

# Verify Kitchen Operations tab accessible
- tapOn:
    text: "Kitchen Operations"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "manager_04_kitchen"

# Verify Settings accessible
- tapOn:
    text: "Settings"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "manager_05_settings"

- stopApp
