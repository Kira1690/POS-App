appId: com.ajinkya123.POSReactNativeApp
name: "QA Permissions 05 — Store Admin Full Access"
# Verifies: store_admin has access to all Settings panels including all 10 setting sections

---
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Navigate to Manager Login from Welcome screen
- tapOn:
    id: "btn-welcome-manager-login"
- waitForAnimationToEnd

# Login as store admin using testIDs
- tapOn:
    id: "email-input"
- inputText: "qa-admin@blueplate2026.io"
- tapOn:
    id: "password-input"
- inputText: "QAAdmin2026!"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "btn-manager-sign-in"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "btn-manager-sign-in"
- waitForAnimationToEnd

- takeScreenshot: "admin_01_after_login"

# Verify Dashboard accessible
- tapOn:
    text: "Dashboard"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "admin_02_dashboard"

# Verify Order Management accessible
- tapOn:
    text: "Order Management"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "admin_03_orders"

# Verify Kitchen Operations accessible
- tapOn:
    text: "Kitchen Operations"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "admin_04_kitchen"

# Verify Settings accessible
- tapOn:
    text: "Settings"
- waitForAnimationToEnd
- assertNotVisible:
    text: "Access Denied|Unauthorized"
- takeScreenshot: "admin_05_settings"

- stopApp
