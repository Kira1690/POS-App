appId: com.ajinkya123.POSReactNativeApp
name: "QA 04: Assign Modifiers — Cup Size to drinks, Protein to mains"
tags:
  - qa
  - menu-setup
---

# ─────────────────────────────────────────────────────
#  QA Phase 4 — Assign modifier groups to items
#
#  Cup Size  → Latte, Cappuccino
#  Protein   → Beef Burger, Grilled Salmon
#
#  Flow: Items tab → tap btn-assign-modifiers-{name} (testID)
#        → AssignModifiersModal opens
#        → tap the modifier group name to select
#        → tap "Save"
#
#  CRITICAL: Use tapOn: id: NOT tapOn: label:
#            label: taps can trigger Android nav bar / Google Search
#
#  Prerequisites: qa_03 completed (Cup Size + Protein groups exist)
#
#  QA Assertions:
#    ✓ Modifier assigned — item shows in items list after save
# ─────────────────────────────────────────────────────

- runFlow: helpers/ensure_dashboard.yaml

# Navigate to Menu Management → Items tab
- waitForAnimationToEnd

- tapOn:
    id: "tab-nav-settings"

- extendedWaitUntil:
    visible:
      id: "settings-nav-menu_management"
    timeout: 10000

# tapOn auto-scrolls the sidebar to find the item
- tapOn:
    id: "settings-nav-menu_management"

- extendedWaitUntil:
    visible:
      id: "tab-menu-items"
    timeout: 10000

# Make sure we're on Items tab
- tapOn:
    id: "tab-menu-items"

- extendedWaitUntil:
    visible: "Latte"
    timeout: 8000

- takeScreenshot: "qa_04_step1_items_list"

# ════════════════════════════════════════════════════
# Assign Cup Size → Latte
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-assign-modifiers-latte"

- extendedWaitUntil:
    visible: "Assign Modifiers"
    timeout: 8000

- takeScreenshot: "qa_04_latte_assign_modal"

# Clear any pre-existing selection, then select Cup Size
- tapOn:
    text: "Clear"

- tapOn:
    text: "Cup Size"

- takeScreenshot: "qa_04_latte_cup_size_selected"

- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Latte"
    timeout: 10000

- assertVisible: "Latte"

- takeScreenshot: "qa_04_PASS_latte_cup_size_assigned"

# ════════════════════════════════════════════════════
# Assign Cup Size → Cappuccino
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-assign-modifiers-cappuccino"

- extendedWaitUntil:
    visible: "Assign Modifiers"
    timeout: 8000

- tapOn:
    text: "Clear"

- tapOn:
    text: "Cup Size"

- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Cappuccino"
    timeout: 10000

- assertVisible: "Cappuccino"

- takeScreenshot: "qa_04_PASS_cappuccino_cup_size_assigned"

# ════════════════════════════════════════════════════
# Assign Protein → Beef Burger
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-assign-modifiers-beef-burger"

- extendedWaitUntil:
    visible: "Assign Modifiers"
    timeout: 8000

- tapOn:
    text: "Clear"

- tapOn:
    text: "Protein"

- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Beef Burger"
    timeout: 10000

- assertVisible: "Beef Burger"

- takeScreenshot: "qa_04_PASS_beef_burger_protein_assigned"

# ════════════════════════════════════════════════════
# Assign Protein → Grilled Salmon
# ════════════════════════════════════════════════════
- tapOn:
    id: "btn-assign-modifiers-grilled-salmon"

- extendedWaitUntil:
    visible: "Assign Modifiers"
    timeout: 8000

- tapOn:
    text: "Clear"

- tapOn:
    text: "Protein"

- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Grilled Salmon"
    timeout: 10000

- assertVisible: "Grilled Salmon"

- takeScreenshot: "qa_04_PASS_grilled_salmon_protein_assigned"

# ── FINAL QA: All 4 modified items still in list ──────
- assertVisible: "Latte"
- assertVisible: "Cappuccino"
- assertVisible: "Beef Burger"
- assertVisible: "Grilled Salmon"

- takeScreenshot: "qa_04_PASS_all_modifiers_assigned"
